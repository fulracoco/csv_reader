name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]  # 1. 监听 main 分支的日常推送（用于构建测试）
    tags:
      - 'v*'          # 2. 监听带有版本号的标签推送（用于触发发布）
  pull_request:
    branches: [main]  # 3. 监听 PR，确保合并前的代码质量
  workflow_dispatch:

jobs:
  build:
    # 只要满足上述任意触发条件，都会先跑 build 任务
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: csv-reader-linux-x64
            artifact-path: dist/*.AppImage
          - os: macos-latest
            target: mac
            artifact-name: csv-reader-macos
            artifact-path: dist/*.dmg
          - os: windows-latest
            target: win
            arch: x64
            artifact-name: csv-reader-win-x64
            artifact-path: dist/*.exe
          - os: windows-latest
            target: win
            arch: arm64
            artifact-name: csv-reader-win-arm64
            artifact-path: dist/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 icnsutils graphicsmagick xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (${{ matrix.target }} ${{ matrix.arch || '' }})
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch || '' }}
        run: |
          if [ -n "$BUILD_ARCH" ]; then
            npm run build:${{ matrix.target }} -- --${{ matrix.arch }}
          else
            npm run build:${{ matrix.target }}
          fi

      # 将打包产物暂存为 Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    # 1. 依赖 build 任务必须先成功完成
    needs: build
    # 2. 核心逻辑：只有当触发事件是 push 且推送的是标签时，才执行 release 任务
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 下载前面 build 任务中暂存的产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 创建 GitHub Release 并上传文件
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}