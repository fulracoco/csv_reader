name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # ── Linux x64 ──────────────────────────────────────────────
          - os: ubuntu-latest
            target: linux
            electron-arch: x64
            artifact-name: csv-reader-linux-x64
            artifact-path: dist/*.AppImage
            rust-target: ''

          # ── Linux ARM64 (使用原生 ARM64 运行器，无需交叉编译) ────────
          - os: ubuntu-24.04-arm 
            target: linux
            electron-arch: arm64
            artifact-name: csv-reader-linux-arm64
            artifact-path: dist/*.AppImage
            rust-target: ''

          # ── macOS (Apple Silicon runner, native arm64) ─────────────
          - os: macos-latest
            target: mac
            electron-arch: ''
            artifact-name: csv-reader-macos
            artifact-path: dist/*.dmg
            rust-target: ''

          # ── Windows x64 ────────────────────────────────────────────
          - os: windows-latest
            target: win
            electron-arch: x64
            artifact-name: csv-reader-win-x64
            artifact-path: dist/*.exe
            rust-target: ''

          # ── Windows ARM64 ──────────────────────────────────────────
          - os: windows-latest
            target: win
            electron-arch: arm64
            artifact-name: csv-reader-win-arm64
            artifact-path: dist/*.exe
            rust-target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Rust toolchain ──────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # ── System dependencies for Linux ───────────────────────────────
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 移除了交叉编译工具链和 QEMU 相关包
          sudo apt-get install -y libfuse2 icnsutils graphicsmagick xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── Build native module ─────────────────────────────────────────
      - name: Build native module (${{ matrix.electron-arch || 'native' }})
        shell: bash
        working-directory: native
        run: |
          if [ -n "${{ matrix.rust-target }}" ]; then
            echo "Cross-compiling for ${{ matrix.rust-target }}"
            # Windows ARM64 依然需要指定链接器或环境变量（如果 rustup 没自动处理）
            if [ "${{ matrix.rust-target }}" = "aarch64-pc-windows-msvc" ]; then
              echo "Setting up Windows ARM64 cross-compile env..."
            fi
            cargo build --release --target ${{ matrix.rust-target }}
          else
            echo "Building natively"
            cargo build --release
          fi
          
          # 检查构建产物（根据你的实际文件名调整）
          # 注意：跨平台编译时产物在 target/<target>/release/ 目录下
          if [ -n "${{ matrix.rust-target }}" ]; then
            TARGET_DIR="target/${{ matrix.rust-target }}/release"
          else
            TARGET_DIR="target/release"
          fi
           # Find the native library and rename it to .node
          if [ -f "$TARGET_DIR/libcsv_native.dylib" ]; then
            mv "$TARGET_DIR/libcsv_native.dylib" "$TARGET_DIR/csv-native.node"
          elif [ -f "$TARGET_DIR/libcsv_native.so" ]; then
            mv "$TARGET_DIR/libcsv_native.so" "$TARGET_DIR/csv-native.node"
          elif [ -f "$TARGET_DIR/csv_native.dll" ]; then
            mv "$TARGET_DIR/csv_native.dll" "$TARGET_DIR/csv-native.node"
          fi

          LIB_NAME="csv-native.node"
          if [ ! -f "$TARGET_DIR/$LIB_NAME" ]; then
            echo "ERROR: Built library not found in $TARGET_DIR"
            ls -la "$TARGET_DIR/" || true
            exit 1
          fi
          echo "Native module ready: $(ls -lh $TARGET_DIR/$LIB_NAME)"

          # Copy to native/ so electron-builder can find it
          cp "$TARGET_DIR/$LIB_NAME" .

      # ── Build Electron app ──────────────────────────────────────────
      - name: Build (${{ matrix.target }} ${{ matrix.electron-arch }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For native ARM64 runners, don't pass arch flag
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            npm run build:${{ matrix.target }}
          elif [ -n "${{ matrix.electron-arch }}" ]; then
            npm run build:${{ matrix.target }} -- --${{ matrix.electron-arch }}
          else
            npm run build:${{ matrix.target }}
          fi

      # ── Rename Windows artifacts (add arch suffix) ─────────────────
      - name: Rename Windows artifacts (add arch suffix)
        if: matrix.target == 'win'
        shell: bash
        run: |
          for f in dist/*.exe; do
            base="${f%.exe}"
            mv "$f" "${base}-${{ matrix.electron-arch }}.exe"
          done

      # ── Standardize Linux AppImage naming ───────────────────────────
      - name: Standardize Linux AppImage naming
        if: matrix.target == 'linux'
        shell: bash
        run: |
          for f in dist/*.AppImage; do
            if [ -f "$f" ]; then
              base="${f%.AppImage}"
              mv "$f" "${base}-${{ matrix.electron-arch }}.AppImage"
            fi
          done

      # ── Upload artifact ────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: List downloaded artifacts
        run: find dist -type f

      - name: Flatten artifacts
        shell: bash
        run: |
          # Move all artifacts from subdirectories to dist root
          find dist -type f ! -path "dist/*" -o -type f -path "dist/*/*" | while read file; do
            if [ -f "$file" ]; then
              mv "$file" "dist/$(basename "$file")"
            fi
          done
          # Clean up empty directories
          find dist -type d -empty -delete
          # List final artifacts
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}