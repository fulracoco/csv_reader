name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # ── Linux x64 ──────────────────────────────────────────────
          - os: ubuntu-latest
            target: linux
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: csv-reader-linux-x64
            bundles: deb,appimage
            binary-name: csv-reader
            bundle-glob: src-tauri/target/release/bundle/deb/*.deb
            bundle-glob2: src-tauri/target/release/bundle/appimage/*.AppImage

          # ── Linux ARM64 ────────────────────────────────────────────
          - os: ubuntu-24.04-arm
            target: linux
            rust-target: aarch64-unknown-linux-gnu
            artifact-name: csv-reader-linux-arm64
            bundles: deb,appimage
            binary-name: csv-reader
            bundle-glob: src-tauri/target/release/bundle/deb/*.deb
            bundle-glob2: src-tauri/target/release/bundle/appimage/*.AppImage

          # ── macOS (Apple Silicon) ──────────────────────────────────
          - os: macos-latest
            target: mac
            rust-target: aarch64-apple-darwin
            artifact-name: csv-reader-macos
            bundles: dmg
            binary-name: csv-reader
            bundle-glob: src-tauri/target/release/bundle/dmg/*.dmg
            bundle-glob2: ''

          # ── Windows x64 ────────────────────────────────────────────
          - os: windows-latest
            target: win
            rust-target: x86_64-pc-windows-msvc
            artifact-name: csv-reader-win-x64
            bundles: nsis
            binary-name: csv-reader.exe
            bundle-glob: src-tauri/target/release/bundle/nsis/*.exe
            bundle-glob2: ''

          # ── Windows ARM64 ──────────────────────────────────────────
          - os: windows-latest
            target: win
            rust-target: aarch64-pc-windows-msvc
            artifact-name: csv-reader-win-arm64
            bundles: nsis
            binary-name: csv-reader.exe
            bundle-glob: src-tauri/target/release/bundle/nsis/*.exe
            bundle-glob2: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app (${{ matrix.target }} ${{ matrix.rust-target }})
        shell: bash
        run: |
          npx tauri build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: Upload installer bundle
        uses: actions/upload-artifact@v5
        if: matrix.bundle-glob != ''
        continue-on-error: true
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-glob }}

      - name: Upload installer bundle (secondary)
        uses: actions/upload-artifact@v5
        if: matrix.bundle-glob2 != ''
        continue-on-error: true
        with:
          name: ${{ matrix.artifact-name }}-appimage
          path: ${{ matrix.bundle-glob2 }}

      - name: Upload raw binary
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: ${{ matrix.artifact-name }}-binary
          path: src-tauri/target/release/${{ matrix.binary-name }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: List downloaded artifacts
        run: |
          if [ -d "dist" ]; then
            find dist -type f
          else
            echo "Warning: dist directory not found - no artifacts were downloaded"
            exit 1
          fi

      - name: Flatten artifacts
        shell: bash
        run: |
          find dist -type f | while read file; do
            if [ -f "$file" ]; then
              mv "$file" "dist/$(basename "$file")"
            fi
          done
          find dist -type d -empty -delete
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
