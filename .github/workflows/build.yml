name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: csv-reader-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: csv-reader-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: csv-reader-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: csv-reader-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: csv-reader-windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: csv-reader-windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Verify tag version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "${TAG_VERSION}" = "${APP_VERSION}" || { echo "Tag ${TAG_VERSION} does not match ${APP_VERSION}"; exit 1; }
          echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"

      - name: Build native binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build platform package
        timeout-minutes: 5
        continue-on-error: true
        run: cargo packager --release --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/csv-reader${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp "${BIN}" "dist/${{ matrix.artifact }}-v${APP_VERSION}${{ runner.os == 'Windows' && '.exe' || '' }}"
          find target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name 'csv-reader_*-setup.exe' \) -exec cp {} dist/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-v${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
