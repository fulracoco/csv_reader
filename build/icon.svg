<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a4a"/>
      <stop offset="100%" style="stop-color:#162038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9cf5"/>
      <stop offset="100%" style="stop-color:#3b7de0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Document body -->
  <rect x="108" y="96" width="296" height="340" rx="18" ry="18" fill="#252f4a" stroke="#3a4570" stroke-width="3"/>

  <!-- Document header bar -->
  <rect x="108" y="96" width="296" height="52" rx="18" ry="18" fill="url(#accent)"/>
  <rect x="108" y="130" width="296" height="18" fill="url(#accent)"/>

  <!-- Grid lines -->
  <line x1="152" y1="176" x2="360" y2="176" stroke="#5b9cf5" stroke-width="2" opacity="0.4"/>
  <line x1="152" y1="216" x2="360" y2="216" stroke="#3a4570" stroke-width="1.5"/>
  <line x1="152" y1="256" x2="360" y2="256" stroke="#3a4570" stroke-width="1.5"/>
  <line x1="152" y1="296" x2="360" y2="296" stroke="#3a4570" stroke-width="1.5"/>
  <line x1="152" y1="336" x2="360" y2="336" stroke="#3a4570" stroke-width="1.5"/>
  <line x1="152" y1="376" x2="360" y2="376" stroke="#3a4570" stroke-width="1.5"/>

  <!-- Vertical divider -->
  <line x1="256" y1="148" x2="256" y2="416" stroke="#3a4570" stroke-width="1.5"/>

  <!-- Header dots -->
  <circle cx="132" cy="122" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="122" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="168" cy="122" r="5" fill="#fff" opacity="0.9"/>

  <!-- Cell highlights -->
  <rect x="164" y="226" width="78" height="20" rx="3" fill="#5b9cf5" opacity="0.15"/>
  <rect x="268" y="266" width="78" height="20" rx="3" fill="#5b9cf5" opacity="0.1"/>
  <rect x="164" y="346" width="78" height="20" rx="3" fill="#5b9cf5" opacity="0.1"/>
  <rect x="268" y="306" width="78" height="20" rx="3" fill="#5b9cf5" opacity="0.15"/>
</svg>
